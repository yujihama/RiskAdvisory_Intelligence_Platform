profiles:
  fast:
    provider: openrouter
    model_env: FAST_MODEL
    default_model: qwen/qwen3.6-flash
    temperature: 0
    max_tokens: 1024
  reasoning:
    provider: openrouter
    model_env: REASONING_MODEL
    default_model: qwen/qwen3.6-flash
    temperature: 0.1
    max_tokens: 4096
  long_context:
    provider: openrouter
    model_env: LONG_CONTEXT_MODEL
    default_model: qwen/qwen3.6-flash
    temperature: 0.1
    max_tokens: 8192
  vision_ocr:
    provider: openrouter
    model_env: OCR_MODEL
    default_model: qwen/qwen2.5-vl-72b-instruct
    temperature: 0
    max_tokens: 4096
  red_team:
    provider: openrouter
    model_env: REDTEAM_MODEL
    default_model: qwen/qwen3.6-flash
    temperature: 0.3
    max_tokens: 4096
  expert_synthesis:
    provider: openrouter
    model_env: EXPERT_SYNTHESIS_MODEL
    default_model: qwen/qwen3.6-flash
    temperature: 0.1
    max_tokens: 4096

agent_profile_map:
  orchestrator-agent: reasoning
  source-intelligence-agent: fast
  client-context-agent: reasoning
  treasury-risk-agent: reasoning
  legal-risk-agent: long_context
  accounting-risk-agent: reasoning
  procurement-risk-agent: reasoning
  expert-as-code-agent: expert_synthesis
  evidence-redteam-agent: red_team
  decision-synthesis-agent: reasoning
