services:
  risk-platform:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "risk_agent_platform.cli", "run-scenario", "--input", "data/sample_inputs/geopolitical_sanctions_risk.json"]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
